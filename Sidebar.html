<!DOCTYPE html>
<html>
  <head>
    <base target="_top" />
    <style>
      body { font-family: Arial, sans-serif; margin: 12px; }
      .row { margin-bottom: 10px; }
      label { display: block; margin-bottom: 4px; font-size: 12px; color: #444; }
      input[type="text"], input[type="number"] {
        width: 100%; padding: 6px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px;
      }
      button {
        padding: 8px 12px; background: #1a73e8; color: white; border: none; border-radius: 4px; cursor: pointer;
      }
      button:disabled { background: #9bbcf2; cursor: not-allowed; }
      .status { font-size: 12px; color: #333; margin-top: 8px; }
    </style>
  </head>
  <body>
    <h3>Demo Table Generator</h3>

    <div class="row">
      <label for="multiplier">Multiplier</label>
      <input type="number" id="multiplier" value="2" />
    </div>

    <div class="row">
      <label for="cell">Output cell (A1)</label>
      <input type="text" id="cell" value="A1" />
    </div>

    <button id="generateBtn">Generate Table</button>
    <div id="status" class="status"></div>

    <script>
      const btn = document.getElementById('generateBtn');
      const status = document.getElementById('status');

      btn.addEventListener('click', () => {
        btn.disabled = true;
        status.textContent = 'Generating...';
        const multiplier = Number(document.getElementById('multiplier').value);
        const cell = String(document.getElementById('cell').value || 'A1');

        google.script.run
          .withSuccessHandler(() => {
            status.textContent = 'Done. Table written.';
            btn.disabled = false;
          })
          .withFailureHandler(err => {
            status.textContent = 'Error: ' + (err && err.message ? err.message : err);
            btn.disabled = false;
          })
          .writeDemoTableFromSidebar(multiplier, cell);
      });
    </script>
  </body>
</html>
